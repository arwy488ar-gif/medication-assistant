<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E7D32">
<title>AI Medication Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: a real app shell. Phone: full screen with a bottom tab bar. Laptop (900px+): side navigation and a centred content column.
     Single light theme on purpose: the course contrast checks (WCAG 1.4.3 / 1.4.11) were run on this palette. */
  :root{ color-scheme:light;
    --page:#E9EEE8; --bg:#F5F7F4; --surface:#FFFFFF; --ink:#1A1F1A; --muted:#4B544B; --line:#767676; --soft:#DCE2DA;
    --primary:#2E7D32; --primary-dark:#1B5E20; --on-primary:#FFFFFF; --primary-soft:#E6F1E7;
    --danger:#B3261E; --danger-soft:#FBEDEC; --warn:#7A4A00; --warn-soft:#FFF2D9; --focus:#0B57D0;
    --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,-apple-system,Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
  button,input,textarea,select{font-family:inherit}
  .app{min-height:100vh;display:flex;flex-direction:column}
  .view{flex:1;width:100%;max-width:640px;margin:0 auto;padding:12px max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px));position:relative}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;background:var(--surface);border-top:1px solid var(--soft);padding:6px 6px calc(8px + env(safe-area-inset-bottom, 0px))}
  .navbrand{display:none}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;border:none;background:none;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;border-radius:12px}
  .tabs button[aria-current="page"]{color:var(--primary-dark)}
  .tabs button[aria-current="page"] .tab-ic{background:var(--primary-soft)}
  .tab-ic{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
  @media (min-width:900px){
    .app{flex-direction:row}
    .tabs{position:sticky;top:0;height:100vh;flex-direction:column;width:232px;flex:none;border-top:none;border-inline-end:1px solid var(--soft);padding:22px 12px;gap:4px}
    .tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;font-size:15.5px;padding:0 8px;min-height:52px}
    .tabs .tab-ic{width:40px}
    .navbrand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--primary-dark);font-size:16px;padding:0 8px 18px}
    .view{max-width:760px;padding-top:28px;padding-bottom:48px}
  }
  svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  svg.s{width:18px;height:18px}
  [dir="rtl"] svg.flip{transform:scaleX(-1)}
  h1{font-size:25px;line-height:1.3;margin:6px 0 4px;text-wrap:balance}
  h2{font-size:17px;margin:18px 0 8px}
  p{margin:0 0 10px}
  .muted{color:var(--muted)}
  .small{font-size:14px}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  h1:focus,h2:focus,.focus-none:focus{outline:none}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px -6px 4px}
  .top .r{display:flex;align-items:center;gap:2px}
  .iconbtn{width:48px;height:48px;border-radius:50%;border:none;background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
  .iconbtn:hover{background:var(--primary-soft)}
  .langbtn{min-height:40px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--primary-dark);font-size:14px;font-weight:700;cursor:pointer}
  .card{background:var(--surface);border-radius:20px;padding:16px;border:1px solid var(--soft)}
  .btn{display:block;width:100%;min-height:54px;padding:10px 16px;font-size:17px;font-weight:700;border-radius:14px;margin:0 0 10px;cursor:pointer;text-align:center}
  .btn svg.i{vertical-align:-6px;margin-inline-end:8px}
  .primary{background:var(--primary);color:var(--on-primary);border:2px solid var(--primary)}
  .primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
  .secondary{background:var(--surface);color:var(--primary-dark);border:2px solid var(--primary)}
  .secondary:hover{background:var(--primary-soft)}
  .danger{background:var(--danger);color:#fff;border:2px solid var(--danger)}
  .ghost{background:transparent;color:var(--primary-dark);border:2px solid transparent;text-decoration:underline}
  .row{display:flex;gap:10px}.row>.btn{flex:1}
  .link{background:none;border:none;color:var(--primary-dark);text-decoration:underline;font-size:16px;min-height:44px;padding:0 4px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:13.5px;font-weight:700;white-space:nowrap}
  .chip svg.i{width:15px;height:15px;stroke-width:2.4}
  .c-due{background:var(--warn-soft);color:var(--warn);border:1px solid #B98A3A}
  .c-taken{background:var(--primary-soft);color:var(--primary-dark);border:1px solid var(--primary)}
  .c-missed{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger)}
  .c-up{background:#F0F2EF;color:var(--muted);border:1px solid #9AA39A}
  .c-wait{background:var(--warn-soft);color:var(--warn);border:1px dashed var(--warn)}
  /* home */
  .hello{font-size:14px;color:var(--muted);margin:0}
  .next{background:var(--primary);color:#fff;border-radius:22px;padding:16px;margin:12px 0 4px}
  .next .lbl{font-size:13px;font-weight:700;letter-spacing:.04em;opacity:.95}
  .next .nm{font-size:21px;font-weight:700;margin:2px 0}
  .next .chip{background:#fff;color:var(--primary-dark);border:none}
  .next .btn.primary{background:#fff;color:var(--primary-dark);border-color:#fff}
  .next .btn.secondary{background:transparent;color:#fff;border-color:#fff}
  .next .row{margin-top:12px}.next .row .btn{margin:0;font-size:16px;min-height:50px}
  .prog{display:flex;align-items:center;gap:14px;margin:10px 0}
  .ring{width:64px;height:64px;flex:none}
  .ring circle{fill:none;stroke-width:7}
  .slot{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:16px 2px 6px}
  .dose{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--soft);border-radius:16px;padding:12px;margin-bottom:8px;width:100%;text-align:start;color:inherit;font-size:inherit;cursor:pointer}
  .dose:hover{border-color:var(--line)}
  .dose.missed{border:2px solid var(--danger)}
  .medic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
  .dose .g{flex:1;min-width:0}
  .dose .n{font-weight:700;font-size:16.5px}
  .dose .m{font-size:14px;color:var(--muted)}
  .dose .t{font-weight:700;font-size:15px;text-align:end;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .fab{position:fixed;inset-inline-end:16px;bottom:94px;z-index:5;display:flex;align-items:center;gap:8px;min-height:56px;padding:0 18px 0 14px;border-radius:28px;border:none;background:var(--primary-dark);color:#fff;font-size:16px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.22);cursor:pointer}
  [dir="rtl"] .fab{padding:0 14px 0 18px}
  .empty{text-align:center;padding:24px 8px}
  .empty .big{width:76px;height:76px;border-radius:50%;background:var(--primary-soft);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;margin:8px auto 12px}
  .empty .big svg.i{width:38px;height:38px}
  /* lists */
  .med{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--soft);border-radius:16px;padding:12px;margin-bottom:8px;width:100%;text-align:start;font-size:inherit;color:inherit;cursor:pointer}
  .med .g{flex:1;min-width:0}
  .med .n{font-weight:700;font-size:17px}
  /* forms */
  .field{margin-bottom:16px}
  .field>label,.field>.lab{display:block;font-weight:700;margin-bottom:6px}
  input[type=text],input[type=time],textarea{width:100%;font-size:17px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:50px;color:var(--ink);background:#fff}
  input[aria-invalid="true"]{border:2px solid var(--danger)}
  textarea{min-height:80px;resize:vertical}
  .inwrap{display:flex;gap:8px}.inwrap input{flex:1}
  .micbtn{width:50px;height:50px;border-radius:12px;border:2px solid var(--primary);background:var(--surface);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;cursor:pointer}
  .opt[aria-checked="true"],.opt[aria-pressed="true"]{border:2px solid var(--primary);background:var(--primary-soft);color:var(--primary-dark);font-weight:700}
  .stepper{display:flex;align-items:center;gap:12px}
  .stepper button{width:48px;height:48px;border-radius:50%;border:2px solid var(--primary);background:var(--surface);color:var(--primary-dark);font-size:22px;font-weight:700;cursor:pointer}
  .stepper output{font-size:20px;font-weight:700;min-width:110px;text-align:center}
  .err{color:var(--danger);font-weight:700;display:flex;gap:6px;align-items:center;margin:6px 0 0;font-size:15px}
  .errbox{border:2px solid var(--danger);background:var(--danger-soft);border-radius:14px;padding:10px 12px;margin-bottom:14px}
  .sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .swatch{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#fff}
  .swatch[aria-checked="true"]{border-color:var(--ink)}
  /* settings rows */
  .set{background:var(--surface);border:1px solid var(--soft);border-radius:18px;padding:0 14px;margin-bottom:14px}
  .srow{display:flex;gap:12px;align-items:center;min-height:62px;padding:10px 0;border-bottom:1px solid var(--soft)}
  .srow:last-child{border-bottom:none}
  .srow .g{flex:1;min-width:0}.srow b{display:block;font-size:16px}.srow small{display:block;color:var(--muted);font-size:13.5px}
  button.srow{width:100%;background:none;border:none;border-bottom:1px solid var(--soft);text-align:start;font-size:inherit;color:inherit;cursor:pointer}
  .switch{width:58px;height:34px;border-radius:17px;border:2px solid var(--line);background:#E3E7E1;position:relative;cursor:pointer;flex:none;padding:0}
  .switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--line);transition:inset-inline-start .15s}
  .switch[aria-checked="true"]{background:var(--primary);border-color:var(--primary)}
  .switch[aria-checked="true"]::after{inset-inline-start:25px;border-color:var(--primary)}
  .swst{font-size:13px;font-weight:700;color:var(--muted);min-width:34px;text-align:end}
  /* history */
  .week{display:flex;justify-content:space-between;gap:4px;margin:8px 0 14px}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:14px;border:1px solid var(--soft);background:var(--surface);cursor:pointer;font-size:12.5px;color:var(--ink);min-height:74px}
  .day[aria-pressed="true"]{border:2px solid var(--primary);background:var(--primary-soft)}
  .day .dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .day .dot svg.i{width:16px;height:16px;stroke-width:2.6}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin-bottom:8px}
  .legend span{display:inline-flex;align-items:center;gap:4px}
  /* overlay (reminder layer) */
  .layer{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto}
  .layer .view{padding-top:12px;padding-bottom:40px;max-width:560px}
  .alarm{background:linear-gradient(180deg,var(--primary-soft),var(--bg) 60%)}
  .hero{width:88px;height:88px;border-radius:50%;margin:18px auto 10px;display:flex;align-items:center;justify-content:center}
  .hero svg.i{width:44px;height:44px;stroke-width:2.3}
  .hero.ok{background:var(--primary-soft);color:var(--primary-dark)}
  .hero.bad{background:var(--danger-soft);color:var(--danger)}
  .hero.warn{background:var(--warn-soft);color:var(--warn)}
  .center{text-align:center}
  .bigmed{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:20px;padding:16px;border:1px solid var(--soft);margin:12px 0 18px}
  .bigmed .medic{width:56px;height:56px;border-radius:16px}
  .bigmed .medic svg.i{width:30px;height:30px}
  .bigmed .n{font-size:21px;font-weight:700}
  .radio{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;min-height:62px;cursor:pointer;background:var(--surface);font-size:17px}
  .radio:has(input:checked){border:2px solid var(--primary);background:var(--primary-soft)}
  .radio input{width:24px;height:24px;margin:0;flex:none;accent-color:var(--primary)}
  .radio small{display:block;color:var(--muted);font-size:14px}
  .note{display:flex;gap:10px;align-items:flex-start;background:#EEF1ED;border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:14px}
  .banner{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;margin:6px 0 12px;font-size:15px}
  .banner .g{flex:1}
  .banner.ok{background:var(--primary-soft);border:1px solid var(--primary)}
  .banner.info{background:#EEF1ED;border:1px solid var(--line)}
  .banner.warn{background:var(--warn-soft);border:1px solid #B98A3A;color:var(--warn)}
  /* sheets / dialogs */
  .scrim{position:fixed;inset:0;background:rgba(12,22,12,.5);z-index:30}
  .sheet{position:fixed;left:10px;right:10px;bottom:10px;z-index:31;background:var(--surface);border-radius:24px;padding:20px 18px 12px;box-shadow:0 -6px 24px rgba(0,0,0,.2);max-height:calc(100% - 30px);overflow:auto}
  .sheet .x{position:absolute;inset-inline-end:8px;top:8px}
  @media (min-width:700px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:480px}}
  .sheet h2{font-size:20px;line-height:1.35;margin:0 0 6px;padding-inline-end:42px}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--primary-dark);background:var(--primary-soft);border-radius:999px;padding:3px 10px;margin-bottom:10px}
  .tag svg.i{width:16px;height:16px}
  .why{font-size:15px;color:var(--muted);margin-bottom:14px}
  .fb{border-top:1px solid var(--soft);margin-top:6px;padding-top:12px}
  .fb .q{font-size:15px;font-weight:700;margin-bottom:8px}
  .heard{background:#EEF1ED;border-radius:12px;padding:10px 12px;min-height:48px;font-size:17px;margin-bottom:12px}
  .pulse{width:74px;height:74px;border-radius:50%;background:var(--primary);color:#fff;margin:4px auto 10px;display:flex;align-items:center;justify-content:center;animation:p 1.4s ease-in-out infinite}
  .pulse svg.i{width:34px;height:34px}
  @keyframes p{0%,100%{box-shadow:0 0 0 0 rgba(46,125,50,.45)}50%{box-shadow:0 0 0 14px rgba(46,125,50,0)}}
  .toast{position:fixed;left:14px;right:14px;bottom:92px;max-width:520px;margin:0 auto;z-index:40;background:#1F2A1F;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .toast .g{flex:1}
  .toast button{background:none;border:none;color:#B9E6BC;font-weight:700;text-decoration:underline;font-size:15px;min-height:44px;cursor:pointer}
  .vstat{border:1px solid var(--primary);background:var(--primary-soft);border-radius:14px;padding:10px 12px;margin:6px 0 12px;font-size:15px}
  .vstat .q{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .vstat .opt{min-height:44px}
  .study{border:2px dashed var(--line);border-radius:18px;padding:12px 14px;margin-bottom:14px;background:#FAFBF9}
  .study .btn{min-height:46px;font-size:15px}
  .study label{display:flex;gap:8px;align-items:center;min-height:40px}
  .study input{width:24px;height:24px;accent-color:var(--primary)}
  [hidden]{display:none!important}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}.switch::after{transition:none}}
  /* numbered callouts for report figures (?annot) */
  .annot [data-c]{position:relative}
  .annot [data-c]::after{content:attr(data-c);position:absolute;inset-inline-start:-12px;top:-10px;width:24px;height:24px;border-radius:50%;background:#C62828;color:#fff;font:700 13px/24px Arial;text-align:center;z-index:60;box-shadow:0 0 0 2px #fff}
  @media (min-width:900px){.fab{bottom:28px;inset-inline-end:32px}.toast{bottom:28px}}
  /* notification banner (simulates the phone's notification) */
  .notif{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top, 0px));z-index:50;max-width:520px;margin:0 auto;display:flex;align-items:stretch;background:rgba(255,255,255,.98);
    border:1px solid var(--soft);border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.22);animation:drop .35s ease-out}
  .notif .nbody{flex:1;display:flex;gap:12px;align-items:center;text-align:start;background:none;border:none;padding:12px 6px 12px 14px;font-size:inherit;color:inherit;cursor:pointer;min-height:72px}
  [dir="rtl"] .notif .nbody{padding:12px 14px 12px 6px}
  .notif .napp{display:block;font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.02em}
  .notif b{display:block;font-size:16px}
  .notif .nt{display:block;font-size:14.5px}
  .notif .logo-s{width:40px;height:40px;border-radius:11px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  .notif .iconbtn{align-self:center}
  @keyframes drop{from{transform:translateY(-120%)}to{transform:none}}
  @media (prefers-reduced-motion:reduce){.notif{animation:none}}
  /* auth */
  .auth{max-width:460px;margin:0 auto;padding:16px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px));min-height:100vh;display:flex;flex-direction:column}
  .logo{width:96px;height:96px;border-radius:28px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;margin:36px auto 14px;box-shadow:0 10px 24px rgba(46,125,50,.28)}
  .logo svg.i{width:50px;height:50px;stroke-width:2.2}
  .seg{display:flex;background:#E7ECE5;border-radius:14px;padding:4px;gap:4px;margin:6px 0 16px}
  .seg button{flex:1;min-height:46px;border:none;border-radius:11px;background:transparent;font-size:15px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .seg button[aria-checked="true"]{background:var(--surface);color:var(--primary-dark);box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .phonein{direction:ltr;display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .phonein span{display:flex;align-items:center;padding:0 12px;background:#EEF1ED;font-weight:700;border-inline-end:1px solid var(--line);direction:ltr}
  .phonein input{border:none;border-radius:0;flex:1;direction:ltr;text-align:left}
  .phonein:focus-within{outline:3px solid var(--focus);outline-offset:2px}
  .phonein input:focus-visible{outline:none}
  .pw{position:relative}.pw input{padding-inline-end:84px}
  .pw button{position:absolute;inset-inline-end:4px;top:4px;min-height:42px;padding:0 10px;border:none;background:none;color:var(--primary-dark);font-weight:700;text-decoration:underline;cursor:pointer}
  .otp{font-size:28px!important;letter-spacing:.5em;text-align:center;direction:ltr;font-weight:700}
  .demo{display:flex;gap:10px;align-items:flex-start;border:1px dashed var(--line);background:#F7F8F6;border-radius:12px;padding:10px 12px;font-size:14.5px;margin-bottom:14px}
  .alt{text-align:center;margin-top:auto;padding-top:16px}
  input[type=email],input[type=password],input[type=tel],input[type=date]{width:100%;font-size:17px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:50px;color:var(--ink);background:#fff}
  /* services */
  .hdr{display:flex;align-items:center;gap:12px;margin:4px 0 8px}

function chime(){
  if (!S.soundOn) return; unlockAudio(); if (!AC) return;
  const t0 = AC.currentTime + .05;
  [880, 1175, 1568, 1175, 1568].forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(), st = t0 + i * .2;
    o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(.0001, st); g.gain.exponentialRampToValueAtTime(.35, st + .02); g.gain.exponentialRampToValueAtTime(.0001, st + .38);
    o.connect(g); g.connect(AC.destination); o.start(st); o.stop(st + .4); });

}

      <p class="note" data-c="5">${ic('info')}<span>${t('stays')}</span></p>
      <button class="btn primary" data-act="lySet">${ic('bell')}${t('setRem')}</button>${micB}`; break; }
    case 'set': body = `${head()}${vstat()}<div class="center" data-c="18"><div class="hero ok">${ic('bell')}</div><h1 id="h" tabindex="-1">${t('setH')}</h1>
      <p role="status" style="font-size:19px;font-weight:700">${t('setT')(T(new Date(post ? post.to : optTime(L0.o||'work'))))}</p><p class="muted">${t('stays')}</p></div>

    case 'taken': body = `${head()}${vstat()}<div class="center" data-c="7"><div class="hero ok">${ic('check')}</div><h1 id="h" tabindex="-1">${t('takenH')}</h1>

/* ============ dialogs ============ */
function dialogHTML(){
  if (S.dialog === 'sug'){
    const L0 = S.layer, m = medById(L0.med), sg = suggestion(m.id), f = S.fbState, o = sg.o || S.fbOpt;
    if (sg.kind !== 'sure' && !['time','off','else'].includes(f)){ S.dialog = null; return ''; }
    let fb = `<div class="fb" data-c="16"><p class="q" id="fbq">${t('helpQ')}</p><div class="opts" role="group" aria-labelledby="fbq">
      <button class="opt" aria-pressed="${f==='up'}" data-act="fbUp">${ic('up','s')}${t('helpful')}</button><button class="opt" aria-pressed="${!!f && f!=='up'}" data-act="fbDown">${ic('down','s')}${t('notHelpful')}</button></div>`;
    if (f === 'up') fb += `<p role="status" style="margin-top:8px">${t('mThanks')}</p>`;
    if (f === 'down') fb += `<p class="q" id="wq" style="margin-top:10px">${t('whyQ')}</p><div class="opts" role="group" aria-labelledby="wq"><button class="opt" data-reason="time">${t('rTime')}</button><button class="opt" data-reason="off">${t('rOff')}</button><button class="opt" data-reason="else">${t('rElse')}</button></div>`;
    if (['time','off','else'].includes(f)) fb += `<div class="banner ok" role="status">${ic('check')}<span class="g">${f==='time'?t('mTime')(T(optTime(S.fbOpt))):f==='off'?t('mOff'):t('mElse')}</span>${f!=='else'?`<button class="link" data-act="fbUndo">${ic('undo','s flip')}${t('undo')}</button>`:''}</div>`;
    fb += '</div>';
    const sure = sg.kind === 'sure';
    return `<div class="scrim" data-act="dlgClose"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dh" data-c="14">
      <button class="iconbtn x" data-act="dlgClose" aria-label="${t('closeSug')}">${ic('x')}</button><span class="tag">${ic('spark')}${t('sugTag')}</span>
      <h2 id="dh" tabindex="-1">${sure ? t('sugQ')(T(optTime(o))) : t('sugTag')}</h2>
      ${sure ? `<p class="why" data-c="15">${t('sugWhy')(optLabel(o), sg.n)}</p><button class="btn primary" data-act="sugSet">${ic('bell')}${t('sugSet')(T(optTime(o)))}</button>` : ''}
      <button class="btn secondary" data-act="dlgClose">${ic('clock')}${t('sugOther')}</button>${fb}</div>`;
  }
  if (S.dialog === 'voice'){
    const v = S.voiceUI || { mode:'fail', why:'novoice' };
    const typeBox = `<form id="typeForm" style="margin-top:6px"><div class="field"><label for="typeIn">${t('cmd')}</label><input type="text" id="typeIn" autocomplete="off" lang="${S.lang}"></div><button class="btn primary" type="submit">${t('run')}</button></form>`;
    let body;
    if (v.mode === 'listen') body = `<div class="pulse" aria-hidden="true">${ic('mic')}</div><h2 id="dh" tabindex="-1" class="center" style="padding:0">${t('vh')}</h2><p class="why center">${t('vhint')}</p>
      <div class="heard" id="heardTxt" aria-live="polite">${esc(v.partial || '…')}</div>
      ${v.typed ? typeBox : `<div class="row"><button class="btn secondary" data-act="vstop">${t('stop')}</button><button class="btn secondary" data-act="vtype">${ic('kbd')}${t('typeIns')}</button></div>`}`;
    else if (v.mode === 'confirm') body = `<span class="tag">${ic('mic')}${t('speak')}</span><p class="why">${esc(t('heard')(v.text))}</p><h2 id="dh" tabindex="-1" data-c="19">${t('didMean')(cmdLabel(v.intent))}</h2>
      <div class="row" style="margin-top:12px"><button class="btn primary" data-act="vconfYes">${ic('check')}${t('yes')}</button><button class="btn secondary" data-act="vconfNo">${ic('x')}${t('no')}</button></div>`;
    else if (v.mode === 'sorry') body = `<h2 id="dh" tabindex="-1">${t('sorryNo')}</h2><div class="row" style="margin-top:12px"><button class="btn primary" data-act="vagain">${ic('mic')}${t('tryAgain')}</button><button class="btn secondary" data-act="dlgClose">${t('useBtns')}</button></div>`;
    else { const msg = { blocked:t('blockedMic'), novoice:t('noVoice'), off:t('voiceOff'), nodue:t('noneDue') }[v.why] || t('notCaught');
      body = `<div class="hero warn" style="width:64px;height:64px;margin-top:2px">${ic('mic')}</div><h2 id="dh" tabindex="-1" role="alert">${msg}</h2>${v.text ? `<p class="why">${esc(t('heard')(v.text))}</p>` : ''}
      ${v.why==='notcaught' ? `<div class="row" style="margin-top:12px"><button class="btn primary" data-act="vagain">${ic('mic')}${t('tryAgain')}</button><button class="btn secondary" data-act="dlgClose">${t('useBtns')}</button></div><button class="link" data-act="vtype">${ic('kbd','s')}${t('typeIns')}</button>`
        : ['off','nodue'].includes(v.why) ? `<button class="btn secondary" data-act="dlgClose">${t('useBtns')}</button>` : typeBox}`; }
    return `<div class="scrim" data-act="dlgClose"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dh"><button class="iconbtn x" data-act="dlgClose" aria-label="${t('stop')}">${ic('x')}</button>${body}</div>`;
  }
  if (S.dialog === 'delAppt'){ const a = S.appts.find(x => x.id === S.aform.id);
    return `<div class="scrim" data-act="dlgClose"></div><div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="dh" aria-describedby="dd">
      <div class="hero bad" style="width:64px;height:64px;margin-top:2px">${ic('trash')}</div><h2 id="dh" tabindex="-1">${t('delApptQ')(esc(a.title))}</h2><p id="dd" class="muted">${t('delApptT')}</p>
      <button class="btn danger" data-act="delApptYes">${ic('trash')}${t('del')}</button><button class="btn secondary" data-act="dlgClose">${t('keepIt')}</button></div>`; }
  if (S.dialog === 'del' || S.dialog === 'reset'){
    const m = S.dialog === 'del' ? medById(S.form ? S.form.id : S.page.id) : null;
    return `<div class="scrim" data-act="dlgClose"></div><div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="dh" aria-describedby="dd">
      <div class="hero bad" style="width:64px;height:64px;margin-top:2px">${ic('trash')}</div><h2 id="dh" tabindex="-1">${m ? t('delQ')(medName(m)) : t('resetQ')}</h2><p id="dd" class="muted">${m ? t('delT') : t('resetT')}</p>
      <button class="btn danger" data-act="${m ? 'delYes' : 'resetYes'}">${ic('trash')}${t('del')}</button><button class="btn secondary" data-act="dlgClose">${t('keepIt')}</button></div>`;
  }
  return '';
}
function cmdLabel(i){ const c = L[S.lang].c[i]; const d = voiceTarget();
  if (i === 'taken') return c(d ? medName(medById(d.med)) : '');
  return typeof c === 'function' ? c(T(optTime(i))) : c; }

/* ============ voice flow ============ */
function voiceTarget(){
  if (S.layer) return S.layer;

}
function startVoice(){
  S.voiceUI = { mode:'listen', partial:'' };
  listen((text, conf) => heard(text, conf), why => { if (why === 'stopped') return; if (S.voiceUI) { S.voiceUI = { mode:'fail', why }; render(); } },
    p => { if (S.voiceUI){ S.voiceUI.partial = p; const el = document.getElementById('heardTxt'); if (el) el.textContent = p || '…'; } });
}
function heard(text, conf){
  const p = parse(text);
  if (p.intent && p.score >= .8 && (conf == null || conf >= .45)){ stopListen(); S.dialog = null; S.voiceUI = null; doIntent(p.intent, text); }
  else if (p.intent && p.score >= .45){ S.voiceUI = { mode:'confirm', text, intent:p.intent }; render(); }
  else { S.voiceUI = { mode:'fail', why:'notcaught', text }; render(); }
}
function doIntent(intent, text){
  logFb({ type:'voice', heard:text, intent });
  if (intent === 'meds'){ S.layer = null; return go('meds'); }
  if (intent === 'home'){ S.layer = null; return go('home'); }
  const tg = voiceTarget();
  if (!tg){ S.voiceUI = { mode:'fail', why:'nodue' }; S.dialog = 'voice'; return render(); }
  const snap = { log:S.log[tg.k] ? { ...S.log[tg.k] } : null, post:S.post[tg.k] ? { ...S.post[tg.k] } : null, layer:S.layer ? { ...S.layer } : null, histLen:S.hist.length, tab:S.tab };
  if (!S.layer) S.layer = { ...tg };
  if (intent === 'taken') takeDose(S.layer, 'voice');
  else if (intent === 'later'){ S.layer = { ...S.layer, scr:'post' }; S.dialog = null; render(true); }
  else postpone(S.layer, intent, 'voice');
  S.vstat = { text, snap, k:tg.k }; render();
}

  if (d.freq){ const n = +d.freq, def = { 1:['09:00'], 2:['09:00','21:00'], 3:['08:00','14:00','20:00'] }[n]; S.form.times = def.map((x,i) => S.form.times[i] || x).slice(0,n); if (new Set(S.form.times).size < n) S.form.times = def; renderKeep(); dev.querySelector(`[data-freq="${n}"]`).focus(); return; }
  if (d.food){ S.form.food = d.food; renderKeep(); dev.querySelector(`[data-food="${d.food}"]`).focus(); return; }
  if (d.color){ S.form.color = d.color; renderKeep(); dev.querySelector(`[data-color="${d.color}"]`).focus(); return; }
  if (d.rate !== undefined){ S.f1.rate = +d.rate; S.f1.err = false; renderKeep(); dev.querySelector(`[data-rate="${d.rate}"]`).focus(); return; }
  if (d.topic !== undefined){ S.f1.topic = S.f1.topic === +d.topic ? null : +d.topic; renderKeep(); dev.querySelector(`[data-topic="${d.topic}"]`).focus(); return; }
  if (d.reason){ const m = medById(S.layer.med), sg = suggestion(m.id); S.fbOpt = sg.o || S.fbOpt; S.fbBefore = { blocked:S.blocked.slice(), sugOn:S.sugOn };
    if (d.reason === 'time') S.blocked.push(m.id+':'+S.fbOpt); if (d.reason === 'off') S.sugOn = false;
    persist(); S.fbState = d.reason; logFb({ type:'suggestion', helpful:false, reason:d.reason, option:S.fbOpt }); render(); const u = dlg.querySelector('.banner .link') || dlg.querySelector('#dh'); u && u.focus(); return; }
  act(d.act, b);
});
function openPost(){ const L0 = S.layer; S.layer = { ...L0, scr:'post', choice:null }; S.fbState = null; S.vstat = null;
  const sg = suggestion(L0.med); S.dialog = sg.kind === 'sure' ? 'sug' : null; S.dlgFocus = null; render(true); }
function act(a, b){
  const L0 = S.layer;
  switch (a){
    case 'lang': { S.lang = S.lang === 'ar' ? 'en' : 'ar'; persist(); render(); const all = [...dev.querySelectorAll('.langbtn')].filter(x => !x.closest('[inert]')); all.length && all[all.length-1].focus(); announce(S.lang==='ar'?'العربية':'English'); return; }
    case 'example': loadStudy(); S.histModeSel = 'usual'; S.tab = 'home'; S.page = null; return render(true);
    case 'svcMeds': return go('meds'); case 'svcAppts': return go('appts'); case 'svcAcct': return go('acct');
    case 'svcHist': S.histDay = 0; return go('home', { name:'hist' });
    case 'addAppt': S.aform = { id:null, title:'', place:'', date:'', time:'', remind:'1d', notes:'', errs:[] }; return go('appts', { name:'appt' });
    case 'apptCancel': S.aform = null; return go(S.tab);
    case 'apptSave': { keepAppt(); const f = S.aform; f.title = f.title.trim();
      f.eT = !f.title; f.eD = !f.date ? 1 : (f.date < isoDay() ? 2 : 0); f.eTm = !f.time;
      f.errs = [f.eT && t('errTitle'), f.eD && (f.eD === 2 ? t('errPastDate') : t('errDate')), f.eTm && t('errATime')].filter(Boolean);
      if (f.errs.length){ render(); const es = document.getElementById('errSum'); es && es.focus(); return; }
      const a = { id:f.id || uid(), title:f.title, place:(f.place||'').trim(), date:f.date, time:f.time, remind:f.remind, notes:f.notes };
      if (f.id) S.appts = S.appts.map(x => x.id === f.id ? a : x); else S.appts.push(a);
      persist(); S.aform = null; go('appts'); toast(f.id ? t('apptUpdated')(esc(a.title)) : t('apptAdded')(esc(a.title))); return; }
    case 'apptDel': keepAppt(); return openDialog('delAppt');
    case 'delApptYes': { const id = S.aform.id, a = S.appts.find(x => x.id === id), idx = S.appts.indexOf(a); S.appts = S.appts.filter(x => x.id !== id); persist(); S.aform = null; S.dialog = null; go('appts');
      toast(t('apptDeleted')(esc(a.title)), () => { S.appts.splice(idx, 0, a); persist(); render(); }); return; }
    case 'logout': signOut(); render(true); toast(t('loggedOut')); return;
    case 'add': S.form = { id:null, name:'', form:'tablet', amount:1, times:['09:00'], food:'any', color:'green', notes:'', errs:[] }; return go(S.tab === 'meds' ? 'meds' : 'meds', { name:'add' });
    case 'editMed': { const m = medById(S.page.id); S.form = { ...JSON.parse(JSON.stringify(m)), errs:[] }; return go('meds', { name:'add' }); }
    case 'formCancel': S.form = null; return go(S.tab);
    case 'formSave': { const f = S.form; f.name = (document.getElementById('fName').value || '').trim(); f.notes = document.getElementById('fNotes').value;
      document.querySelectorAll('[data-ti]').forEach(inp => f.times[+inp.dataset.ti] = inp.value);
      f.errName = !f.name; f.errTimes = new Set(f.times).size < f.times.length || f.times.some(x => !x); f.errs = [f.errName && t('errName'), f.errTimes && t('errTimes')].filter(Boolean);
      if (f.errs.length){ render(); const es = document.getElementById('errSum'); es && es.focus(); return; }
      const m = { id:f.id || uid(), name:f.name, form:f.form, amount:f.amount, times:[...f.times].sort(), food:f.food, color:f.color, notes:f.notes };
      if (f.id) S.meds = S.meds.map(x => x.id === f.id ? m : x); else S.meds.push(m);
      persist(); S.form = null; go('meds'); toast(f.id ? t('updated')(esc(m.name)) : t('added')(esc(m.name))); return; }
    case 'formDel': return openDialog('del');
    case 'delYes': { const id = S.form ? S.form.id : S.page.id, m = medById(id), idx = S.meds.indexOf(m); S.meds = S.meds.filter(x => x.id !== id); persist(); S.form = null; S.dialog = null; go('meds');
      toast(t('deleted')(esc(m.name)), () => { S.meds.splice(idx, 0, m); persist(); render(); }); return; }
    case 'pageBack': S.f1 = null; return go(S.tab);
    case 'feedback': S.f1 = null; return go('acct', { name:'fb' });
    case 'sendFb': if (S.f1.rate === null){ S.f1.err = true; render(); dev.querySelector('[data-rate="0"]').focus(); announce(t('f1err')); return; }
      logFb({ type:'app', rating:S.f1.rate, topic:S.f1.topic, note:S.f1.note }); S.f1.sent = true; return render(true);
    case 'dictNote': return dictInto('fbNote', v => { S.f1.note = v; });
    case 'dictName': return dictInto('fName', v => { S.form.name = v; S.form.errName = false; renderKeep(); });
    case 'resetAll': return openDialog('reset');
    case 'resetYes': { const nm = S.name; Object.assign(S, blank(), { name:nm, dialog:null }); persist(); return go('home'); }
    case 'loadStudy': loadStudy(); S.histModeSel = 'usual'; toast(t('loadStudy') + ' ✓'); return go('home');
    case 'sendRem': { if (!S.meds.length) loadStudy(); const m = medById('bp') || S.meds[0]; const k = key(isoDay(), m.id, m.times[0]);
      delete S.log[k]; delete S.post[k]; persist(); S.banner = null; go('home'); return notify({ kind:'dose', d:{ k, med:m.id, time:m.times[0] } }); }
    case 'fireRem': { const e = Object.entries(S.post).filter(([k]) => k.startsWith(isoDay())).pop(); if (!e){ toast(t('noPost'), null, 'info'); return; }
      const [k, p] = e, [, id, tm] = k.split('|'); p.to = new Date(Date.now() - 1000).toISOString(); persist(); S.shownKeys[k+'p'] = true; go('home');
      return notify({ kind:'dose', post:true, d:{ k, med:id, time:tm } }); }
    /* reminder layer */
    case 'lyClose': S.banner = null; closeLayer(); return;
    case 'lyTake': return takeDose(L0, 'button');
    case 'lyLater': return openPost();
    case 'lyBackRem': S.layer = { ...L0, scr:'rem' }; S.dialog = null; return render(true);
    case 'lySet': { const v = (dev.querySelector('input[name=when]:checked') || {}).value || '30'; return postpone(L0, v, 'button'); }
    case 'lyChange': delete S.post[L0.k]; S.hist = S.hist.slice(0, -1); persist(); S.layer = { ...L0, scr:'post' }; S.dialog = null; S.fbState = null; return render(true);
    case 'lyCancelRem': delete S.post[L0.k]; S.hist = S.hist.slice(0, -1); persist(); S.banner = t('remCancelled'); S.layer = { ...L0, scr:'rem' }; S.vstat = null; return render(true);
    case 'lyUndoAsk': S.layer = { ...L0, scr:'undo' }; return render(true);
    case 'lyBackTaken': S.layer = { ...L0, scr:'taken' }; return render(true);
    case 'lyUndo': delete S.log[L0.k]; persist(); S.banner = t('undone'); S.layer = { ...L0, scr:'rem' }; S.vstat = null; return render(true);
    case 'lyRetry': if (S.offline){ S.layer = { ...L0, retried:true }; render(); announce(t('still')); } else { S.log[L0.k].s = 'taken'; persist(); S.layer = { ...L0, scr:'taken' }; render(true); } return;
    /* suggestion */
    case 'sugSet': { const o = suggestion(L0.med).o; logFb({ type:'suggestion', accepted:true, option:o }); S.dialog = null; return postpone(L0, o, 'suggestion'); }
    case 'dlgClose': return closeDialog();
    case 'fbUp': S.fbState = 'up'; logFb({ type:'suggestion', helpful:true }); render(); dlg.querySelector('[data-act=fbUp]').focus(); return;
    case 'fbDown': S.fbState = 'down'; render(); dlg.querySelector('[data-reason]').focus(); return;
    case 'fbUndo': Object.assign(S, S.fbBefore); persist(); S.fbState = null; render(); return;
    /* voice */
    case 'mic': if (!S.voiceOn){ S.voiceUI = { mode:'fail', why:'off' }; return openDialog('voice'); }
      if (!S.layer && !dueDoses().length){ /* still allow navigation commands */ }
      S.dlgFocus = b; startVoice(); S.dialog = 'voice'; return render();
    case 'vstop': if (dictation){ stopListen(); return; } stopListen(); if (S.voiceUI && S.voiceUI.partial) heard(S.voiceUI.partial, null); else { S.voiceUI = { mode:'fail', why:'notcaught' }; render(); } return;
    case 'vtype': stopListen(); S.voiceUI = { mode:'listen', partial:'', typed:true, focusType:true }; return render();
    case 'vagain': startVoice(); return render();
    case 'vconfYes': { const v = S.voiceUI; S.dialog = null; S.voiceUI = null; return doIntent(v.intent, v.text); }
    case 'vconfNo': logFb({ type:'voice', heard:S.voiceUI.text, intent:S.voiceUI.intent, correct:false }); S.voiceUI = { mode:'sorry' }; return render();
    case 'vyes': S.vstat.ok = true; logFb({ type:'voice', heard:S.vstat.text, correct:true }); render(); announce(t('vThanks')); return;
    case 'vno': { const v = S.vstat; logFb({ type:'voice', heard:v.text, correct:false });
      if (v.snap.log) S.log[v.k] = v.snap.log; else delete S.log[v.k]; if (v.snap.post) S.post[v.k] = v.snap.post; else delete S.post[v.k];
      S.hist = S.hist.slice(0, v.snap.histLen); persist(); S.vstat = null; S.banner = t('vUndone');
      if (v.snap.layer) S.layer = { ...v.snap.layer }; else S.layer = null; return render(true); }
    case 'toastUndo': { const f = S.toast.undoFn; S.toast = null; f && f(); renderToast(); return; }
    case 'toastX': S.toast = null; renderToast(); return;
  }
}
function dictInto(id, set){
  const el = document.getElementById(id);
  listen(text => { const v = (el.value ? el.value + ' ' : '') + text; el.value = v.trim(); set(el.value.trim()); }, why => { if (why !== 'stopped') toast(why === 'blocked' ? t('blockedMic') : t('noVoice'), null, 'err'); });
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (S.dialog){ e.preventDefault(); closeDialog(); } else if (S.layer){ e.preventDefault(); closeLayer(); } return; }
  if (e.key === 'Tab' && S.dialog){ const f = [...dlg.querySelectorAll('button, input')].filter(x => x.offsetParent !== null);
    if (!f.length) return; const a = f[0], z = f[f.length-1];
    if (!dlg.contains(document.activeElement)){ e.preventDefault(); a.focus(); }
    else if (e.shiftKey && document.activeElement === a){ e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z){ e.preventDefault(); a.focus(); } }
});

/* ============ real-time reminders (while the app is open) ============ */
setInterval(() => {
  if (S.layer || S.dialog || !S.uid) return;
  apptAlerts();
  for (const d of dosesFor(now())){
    const st = status(d), p = S.post[d.k];
    const due = st.s === 'due' && (now() - (p ? new Date(p.to) : d.when)) < 120e3;
    const tag = d.k + (p ? 'p' : '');
    if (due && !S.shownKeys[tag] && !S.notif){ S.shownKeys[tag] = true; notify({ kind:'dose', post:!!p, d:{ k:d.k, med:d.m.id, time:d.time } }); break; }
  }
  const sig = dosesFor(now()).map(x => status(x).s).join();
  if (sig !== tick.sig){ tick.sig = sig; if (!S.page && S.tab === 'home' && !S.layer) renderKeep(); }
}, 20000);
const tick = {};

/* ============ start (deep links are used for report figures) ============ */
(function start(){
  const q = new URLSearchParams(location.search);
  if (q.get('lang')) S.lang = q.get('lang') === 'en' ? 'en' : 'ar';
  if (q.has('annot')) document.body.classList.add('annot');
  if (q.has('shot')) document.body.classList.add('shot');
  const h = location.hash.slice(1);
  const AUTH = { welcome:['welcome','phone'], login:['login','phone'], 'login-email':['login','email'], signup:['signup','phone'], 'signup-email':['signup','email'], otp:['otp','phone'], forgot:['forgot','email'] };
  if (q.has('fresh') || AUTH[h]){ S.uid = null; S.auth = { scr:(AUTH[h]||['welcome'])[0], method:(AUTH[h]||[0,'phone'])[1], errs:{} };
    if (h === 'otp') Object.assign(S.auth, { via:'phone', purpose:'login', phone:'512345678', code:'4821', resendAt:Date.now()+30000 });
    render(); return; }
  if (q.has('shot')){ const acc = ensureTest(); signIn(acc.id); }
  if (!S.uid){ render(); return; }
  const FIG = ['notif','rem','post','sug','set','taken','undo','off','voice','vconfirm','add','med','fb','returned','appt-add','hist-page'];
  const shot = q.has('shot');
  if (shot && (FIG.includes(h) || ['home','meds','appts','acct'].includes(h))){ loadStudy(); S.histModeSel = 'usual';
    dosesFor(now()).forEach(x => { if (x.when < now() && x.m.id !== 'vitd' && x.m.id !== 'bp') S.log[x.k] = { s:'taken', at:new Date(x.when.getTime()+5*60e3).toISOString() }; }); }
  const bp = medById('bp'), k = (bp && shot) ? key(isoDay(), 'bp', '09:00') : null;
  if (k) { delete S.log[k]; S.post[k] = { to:new Date(Date.now()-60e3).toISOString(), o:'30' }; if (h !== 'home') delete S.post[k]; }
  const L0 = k ? { scr:'rem', k, med:'bp', time:'09:00' } : null;
  switch (h){
    case 'meds': case 'appts': case 'acct': case 'home': S.tab = h; break;
    case 'hist-page': S.tab = 'home'; S.page = { name:'hist' }; break;
    case 'appt-add': S.tab = 'appts'; S.aform = { id:null, title:'', place:'', date:'', time:'', remind:'1d', notes:'', errs:[] }; S.page = { name:'appt' }; break;
    case 'rem': S.layer = L0; break;
    case 'notif': S.tab = 'home'; S.notif = { kind:'dose', id:1, d:{ k, med:'bp', time:'09:00' } }; break;
    case 'returned': S.post[k] = { to:new Date(Date.now()-1000).toISOString(), o:'work' }; S.banner = S.lang==='ar' ? `الساعة الآن ${T(now())}.` : `It is now ${T(now())}.`; S.layer = L0; break;
    case 'post': S.layer = { ...L0, scr:'post' }; break;
    case 'sug': S.layer = { ...L0, scr:'post' }; S.dialog = 'sug'; break;
    case 'set': S.post[k] = { to:optTime('work').toISOString(), o:'work' }; S.layer = { ...L0, scr:'set', o:'work' }; break;
    case 'taken': S.log[k] = { s:'taken', at:now().toISOString() }; S.layer = { ...L0, scr:'taken' }; break;
    case 'undo': S.log[k] = { s:'taken', at:now().toISOString() }; S.layer = { ...L0, scr:'undo' }; break;
    case 'off': S.log[k] = { s:'wait', at:now().toISOString() }; S.layer = { ...L0, scr:'off' }; break;
    case 'voice': S.layer = L0; S.dialog = 'voice'; S.voiceUI = { mode:'listen', partial: S.lang==='ar' ? 'ذكّرني بعد ما أخلص' : 'Remind me when I finish' }; break;
    case 'vconfirm': S.layer = L0; S.dialog = 'voice'; S.voiceUI = { mode:'confirm', text: S.lang==='ar' ? 'ذكرني بعد ما اخلس' : 'remind me after I finish walk', intent:'work' }; break;
    case 'add': S.tab = 'meds'; S.form = { id:null, name:'', form:'tablet', amount:1, times:['09:00'], food:'any', color:'green', notes:'', errs:[] }; S.page = { name:'add' }; break;
    case 'med': S.tab = 'meds'; S.page = { name:'med', id:'dia' }; break;
    case 'fb': S.tab = 'acct'; S.page = { name:'fb' }; break;
  }
  render();
})();
